services:
  postgres:
    image: postgres:17-alpine
    container_name: equa-postgres
    environment:
      POSTGRES_DB: equa
      POSTGRES_USER: ${DATABASE_USERNAME:-equa}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - equa-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-equa} -d equa"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  equa-postgres-data:
